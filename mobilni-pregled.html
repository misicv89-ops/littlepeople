<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<title>Little People – Desktop i mobilni prikaz</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&amp;family=Nunito+Sans:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#ECE6DB;font-family:'Nunito Sans',system-ui,sans-serif;color:#2B2622}a{color:#3E6350}a:hover{color:#2F5140}</style>
</helmet>
<div style="display:flex;align-items:flex-end;gap:80px;padding:60px 80px;width:max-content;zoom:{{ zoom }}">
  <div style="display:flex;flex-direction:column;gap:16px;flex:none">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="background:#2B2622;color:#FAF6EF;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px">Mobilni</span>
      <span style="font-family:'Baloo 2',sans-serif;font-weight:600;font-size:22px">370 × 780</span>
    </div>
    <div style="position:relative;padding:12px;border-radius:56px;background:#1F1C1A;box-shadow:0 40px 80px -30px rgba(43,38,34,.55), inset 0 0 0 2px #3A3532">
      <div style="position:relative;width:370px;height:820px;border-radius:44px;overflow:hidden;background:#FAF6EF;display:flex;flex-direction:column">
        <div style="flex:none;height:40px;background:#FAF6EF;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:700;color:#2B2622;position:relative">
          <span>9:41</span>
          <span style="position:absolute;left:50%;top:10px;transform:translateX(-50%);width:96px;height:26px;border-radius:999px;background:#1F1C1A"></span>
          <span style="display:flex;gap:4px;align-items:center"><span style="width:16px;height:9px;border-radius:2px;background:#2B2622"></span><span style="width:22px;height:11px;border-radius:3px;border:1.5px solid #2B2622"></span></span>
        </div>
        <iframe src="index.html" title="Little People – mobilni prikaz 370px" style="display:block;flex:none;width:370px;height:780px;border:0;background:#FAF6EF"></iframe>
        <span style="position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:120px;height:5px;border-radius:999px;background:#2B2622;opacity:.8;pointer-events:none"></span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    this.onResize = () => this.forceUpdate();
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const vw = typeof window !== 'undefined' ? window.innerWidth : 1200;
    const vh = typeof window !== 'undefined' ? window.innerHeight : 900;
    return { zoom: Math.min(1, Math.max(0.3, Math.min(vw / 560, vh / 1000))) };
  }
}
</script>
</body>
</html>
